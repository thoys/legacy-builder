name: 'React Native Android CI'

on:
  push:
    branches: [ feat/react-native ]
  pull_request:
    branches: [ feat/react-native ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Enable Long Paths
      shell: powershell
      run: |
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `  -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

    - name: 'Checkout code'
      uses: actions/checkout@v3

    - name: Ensure Ninja >= 1.12
      shell: powershell
      run: |
        Write-Output "Checking for ninja..."
        $cmd = Get-Command ninja -ErrorAction SilentlyContinue
        if ($null -eq $cmd) {
          Write-Output "ninja not found — installing ninja 1.12.0 via Chocolatey"
          choco install ninja --version=1.12.0 -y --no-progress
        } else {
          $ninja = (& ninja --version) -replace "\\s+",""
          try {
            if ([version]$ninja -lt [version]"1.12.0") {
              Write-Output "Ninja $ninja is older than 1.12.0 — installing 1.12.0"
              choco install ninja --version=1.12.0 -y --no-progress
            } else {
              Write-Output "Ninja $ninja meets requirement"
            }
          } catch {
            Write-Output "Could not parse ninja version \"$ninja\" — installing 1.12.0"
            choco install ninja --version=1.12.0 -y --no-progress
          }
        }
        Write-Output "Final ninja version:"
        ninja --version

    - name: 'Run wash.bash'
      run: |
        ./scripts/wash.bash
      shell: bash

    - name: 'Run rinse.bash'
      run: |
        ./scripts/rinse.bash
      shell: bash

    - name: 'Run repeat.bash'
      run: |
        ./scripts/repeat.bash
      shell: bash
